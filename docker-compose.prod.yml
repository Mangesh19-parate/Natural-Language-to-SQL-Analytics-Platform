version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sql_assistant_backend_prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - METADATA_DB_URL=sqlite:///./app_metadata_prod.db
      - BUSINESS_DB_URL=sqlite:///./enterprise_business_prod.db
      - JWT_SECRET=prod_super_secure_jwt_secret_key_2026
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sql_assistant_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_data:
