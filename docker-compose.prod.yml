version: '3.8'

services:
  postgres_metadata:
    image: postgres:15-alpine
    container_name: sql_assistant_metadata_pg_prod
    restart: always
    environment:
      POSTGRES_DB: ${METADATA_DB_NAME:-metadata_prod}
      POSTGRES_USER: ${METADATA_DB_USER:-trustengine_admin}
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD:?Set METADATA_DB_PASSWORD in production environment}
    volumes:
      - pg_metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METADATA_DB_USER:-trustengine_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_business:
    image: postgres:15-alpine
    container_name: sql_assistant_business_pg_prod
    restart: always
    environment:
      POSTGRES_DB: ${BUSINESS_DB_NAME:-enterprise_business_prod}
      POSTGRES_USER: ${BUSINESS_DB_USER:-business_admin}
      POSTGRES_PASSWORD: ${BUSINESS_DB_PASSWORD:?Set BUSINESS_DB_PASSWORD in production environment}
    volumes:
      - pg_business_data:/var/lib/postgresql/data
      - ./backend/scripts/init_postgres_roles.sql:/docker-entrypoint-initdb.d/init_postgres_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BUSINESS_DB_USER:-business_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sql_assistant_backend_prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - METADATA_DB_URL=postgresql://${METADATA_DB_USER:-trustengine_admin}:${METADATA_DB_PASSWORD:?Set METADATA_DB_PASSWORD}@postgres_metadata:5432/${METADATA_DB_NAME:-metadata_prod}
      - BUSINESS_ADMIN_DB_URL=postgresql://${BUSINESS_DB_USER:-business_admin}:${BUSINESS_DB_PASSWORD:?Set BUSINESS_DB_PASSWORD}@postgres_business:5432/${BUSINESS_DB_NAME:-enterprise_business_prod}
      - BUSINESS_DB_URL=postgresql://${BUSINESS_READONLY_USER:-business_readonly}:${BUSINESS_READONLY_PASSWORD:-readonly_secret_pass}@postgres_business:5432/${BUSINESS_DB_NAME:-enterprise_business_prod}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in production}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres_metadata:
        condition: service_healthy
      postgres_business:
        condition: service_healthy
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sql_assistant_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_data:
  pg_metadata_data:
  pg_business_data:

